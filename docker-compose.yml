services:
  app:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    env_file:
      - .env.example
    environment:
      DATABASE_PATH: /data/accountant_support.db
      WORKFLOW_PATH: /app/workflows/vendor_invoice.v1.json
      OUTLOOK_CLIENT_ID: ${OUTLOOK_CLIENT_ID:-}
      OUTLOOK_TENANT_ID: ${OUTLOOK_TENANT_ID:-common}
      OUTLOOK_SCOPES: ${OUTLOOK_SCOPES:-offline_access User.Read Mail.Read}
    volumes:
      - ./data:/data
      - ./workflows:/app/workflows:ro
